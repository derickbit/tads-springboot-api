# Banco de dados (valores padrao servem para o MariaDB do docker-compose.yml)
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/tads_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# update: cria e ajusta as tabelas conforme as entidades, sem apagar os dados
spring.jpa.hibernate.ddl-auto=update

# Mostra os comandos SQL no console (desligue em producao)
spring.jpa.show-sql=true

# Segredo usado para assinar o JWT. NAO ha valor padrao de proposito:
# defina a variavel de ambiente JWT_SECRET (minimo 32 caracteres).
api.security.token.secret=${JWT_SECRET}
